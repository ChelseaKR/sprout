    added: '2026-07-08'
- id: groundedness-pothos-light-low-light-selector
  question: What kind of light does my Pothos need?
  light: low light
  expected_behavior: answer
  expected_facts:
  - survive in low light
  language: en
  rationale: EXP-05 — the identical question, only with light="low light" stated as an
    explicit, non-persisted selector, must surface the corpus's low-light-tolerance
    sentence, which the unselected baseline case does not surface within
    generation.max_sentences. Pairs with groundedness-pothos-light-no-selector.
  provenance:
    source: synthetic
    license: CC0-1.0
    added: '2026-07-08'
