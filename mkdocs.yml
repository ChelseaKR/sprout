site_name: Sprout
site_description: A grounded, evaluated, multilingual plant-care assistant and eval harness.
site_author: Chelsea Kelly-Reif
site_url: https://sprout.chelseakr.com/
repo_url: https://github.com/ChelseaKR/sprout
copyright: Copyright 2026 Chelsea Kelly-Reif — Apache-2.0

theme:
  name: material
  # Holds one file: sitemap.xml. mkdocs' own template stamps every <lastmod> with
  # the build date; this one emits the date docs_hooks/sitemap_lastmod.py derived
  # from the page's own history, and omits the element where there is none.
  custom_dir: theme_overrides
  palette:
    primary: green
    accent: green
  features:
    - navigation.sections
    - content.code.copy

# Every page shipped mkdocs' fallback site_description, so all 52 published URLs
# carried one identical sentence. The hook gives each page the description its own
# opening paragraph already states; it writes no new copy and leaves a page that
# declares its own description alone.
# Every sitemap entry carried <lastmod>{build date}, so a page untouched since
# August advertised itself as changed this morning, on all 53 URLs, every day. The
# hook dates each page from the commit that last changed its source and publishes
# no date where there is none to publish.
hooks:
  - docs_hooks/page_description.py
  - docs_hooks/sitemap_lastmod.py
  # Every page said what it was to a person and nothing to a machine.
  # This writes one schema.org block per page out of the title, description,
  # canonical and nav mkdocs already has — no new copy, and no `Dataset`
  # node, which would be a request to be harvested rather than a description.
  - docs_hooks/structured_data.py
  # Google Analytics 4 on every handbook page, with the footer opt-out (ADR 0023). The
  # loader itself is web-static/public/analytics.js, published at the site root.
  - docs_hooks/analytics.py

extra_css:
  - assets/analytics.css

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

# `links.not_found: ignore` was here to tolerate GitHub-first links into the source
# tree (`../src/...`, `../README.md`). It tolerated them on the published site too,
# where they are 404s: twenty-five were live at once. Those links are now absolute
# GitHub URLs, which work in both places, so the check is on — under --strict it is an
# error, and `sprout site-check` repeats it over the deployed tree, which is the only
# place the copied web-static surface can be seen.
# The not-in-nav reference docs (ADRs, audits) are still deliberate.
validation:
  nav:
    omitted_files: ignore
    not_found: warn
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore
    anchors: warn

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Threat model: THREAT-MODEL.md
  - Adapt to your domain: ADAPT.md
  - Roadmap: ROADMAP.md
  - Responsible-tech audits: RESPONSIBLE-TECH-AUDITS.md
  - Privacy: privacy.md
  - ASVS L2 integration review: audits/asvs-l2-review-2026-07-12.md
  - Accessibility:
      - Statement: a11y/STATEMENT.md
      - Conformance report (ACR): accessibility/ACR.md
  - Cards:
      - Model card: cards/model-card.md
      - Data card (corpus): cards/data-card-corpus.md
  - Evaluation report: audits/eval-report.md
  - ADRs:
      - Record decisions: adr/0000-record-architecture-decisions.md
      - Family Greenhouse integration: adr/0013-family-greenhouse-first-party-integration.md
      - Public web surface: adr/0015-web-is-a-reference-and-assurance-surface.md
