# Static-vector semantic clusters (EXP-03, ADR-0017).
#
# Each cluster groups English and Spanish synonyms/paraphrases of one plant-care concept.
# `scripts/generate_static_vectors.py` turns this file into `static_vectors.json`: every
# cluster gets one deterministic seed vector, and every term in it gets that seed vector
# plus a small deterministic per-term jitter, so synonyms and EN/ES translations land close
# together in cosine space while staying distinguishable from each other. Terms are written
# as natural phrases; the generator tokenizes them with the same `content_tokens()` pipeline
# retrieval and grounding use, so this file needs no manual stemming or accent-folding.
#
# This is hand-authored, original vocabulary work for Sprout's plant-care domain — not
# derived from any third-party embedding model or corpus — so it carries no external
# license obligation. See `manifest.yaml` in this directory for full provenance.

