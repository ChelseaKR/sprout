version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    # This root job also parses infra/requirements.txt: its dependency snapshot
    # lists aws-cdk-lib and constructs, which exist nowhere else in the repo. That
    # put two unpinned pip ranges in the same group as the uv.lock packages, and
    # Dependabot keeps a group change only when every member has a requirements
    # change or every member has a previous version. The uv.lock bumps have a
    # previous version and, since the 2026-09-10 run switched them to
    # widen_ranges, no requirements change; the CDK ranges have a requirements
    # change and no previous version. Mixed, the group was dropped on every run
    # from 2026-09-10 to 2026-10-08 ("Skipping change to group python-deps ...
    # Previous version was not provided for: 'aws-cdk-lib'") and opened nothing.
    # The pip entry for /infra below owns those two pins; this job ignores them.
    ignore:
      - dependency-name: "aws-cdk-lib"
      - dependency-name: "constructs"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR for the whole CodeQL action set: init, analyze, autobuild and
    # upload-sarif must always run the same version. Since CodeQL Action
    # 3.30.4 the non-init steps hard-error when they load a configuration
    # file written by a different version, so a half-applied bump breaks the
    # scan rather than merely warning.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The entries below cover what only Renovate's default managers tracked until
  # Renovate was disabled here (#192).

  # Base images in Dockerfile and infra/Dockerfile: python:3.12-slim and the
  # AWS Lambda Web Adapter. Dependabot reads `FROM` lines only, so the
  # `COPY --from=ghcr.io/astral-sh/uv:0.11` in both files is a manual check
  # (listed at the end of this file).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # The local-dev OTel Collector, Tempo, Mimir and Grafana images in
  # docker-compose.observability.yml.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      observability-stack:
        patterns: ["*"]
  # infra/requirements.txt: the CDK app's dependencies, kept out of
  # pyproject.toml/uv.lock on purpose (see its header).
  - package-ecosystem: "pip"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cdk-deps:
        patterns: ["*"]
  # web-static/: the TypeScript port's toolchain, installed with `npm ci` from
  # its committed lockfile.
  - package-ecosystem: "npm"
    directory: "/web-static"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-static-deps:
        patterns: ["*"]

# Not covered by any entry above, because Dependabot has no ecosystem for these
# pins. Renovate's default `dockerfile`, `pyenv` and `github-actions` managers
# proposed bumps to them until it was disabled (#192). They are now a manual
# check:
#   - `COPY --from=ghcr.io/astral-sh/uv:0.11` in Dockerfile and infra/Dockerfile
#     (Dependabot's docker ecosystem reads `FROM` lines only)
#   - `.python-version` (the local / uv interpreter), when adopting a new Python
#     minor
#   - the `node-version:` inputs to actions/setup-node in .github/workflows/
