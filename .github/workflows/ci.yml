name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# Least-privilege by default; jobs escalate only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12","3.13"]') || fromJSON('["3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install (dev + serve) on ${{ matrix.python }}
        run: uv sync --extra serve --python ${{ matrix.python }}
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest (branch coverage gate >=90% from pyproject)
        run: uv run pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install (dev)
        run: uv sync
      - name: Semgrep (SAST)
        run: uvx semgrep scan --config p/python --error src
      - name: pip-audit (blocking — no || true)
        run: uv run pip-audit
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install (dev + serve)
        run: uv sync --extra serve
      - name: Ingest the bundled corpus
        run: uv run sprout ingest
      - name: Eval suites (offline deterministic judge, merge-blocking)
        run: uv run sprout eval --out docs/audits
      - name: Structural a11y gate (chat UI + HTML report)
        run: |
          uv run sprout a11y-check web/dist/index.html
          uv run sprout a11y-check docs/audits/eval-report.html
      - name: Judge calibration gate (agreement + Cohen's kappa)
        run: uv run sprout calibrate eval/judge_probes.yaml --out docs/audits

  pa11y:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory browser cross-check; excluded from ci-gate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install + ingest
        run: uv sync --extra serve && uv run sprout ingest
      - name: Serve and pa11y the UI
        run: |
          uv run sprout serve &
          sleep 5
          npx --yes pa11y-ci --config web/.pa11yci.json || true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install (docs)
        run: uv sync --group docs
      - name: MkDocs strict build
        run: uv run mkdocs build --strict

  ci-gate:
    # The ONLY required status check for branch protection. pa11y is advisory.
    if: always()
    needs: [test, security, eval-a11y, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates to pass (skipped path-filtered jobs are OK)
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "gate results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a required gate did not pass: $r"
              exit 1
            fi
          done
