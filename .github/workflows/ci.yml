name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# Least-privilege by default; jobs escalate only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12","3.13"]') || fromJSON('["3.12","3.13"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install (dev + serve) on ${{ matrix.python }}
        run: uv sync --frozen --extra serve --python ${{ matrix.python }}
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest (branch coverage gate >=90% from pyproject)
        run: uv run pytest
      - name: Build sdist + wheel (packaging regression check — CQ-10)
        run: uv build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install (dev)
        run: uv sync --frozen
      - name: Semgrep (SAST)
        run: uvx semgrep scan --config p/python --error src
      - name: pip-audit (blocking — no || true)
        run: uv run pip-audit
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install (dev + serve)
        run: uv sync --frozen --extra serve
      - name: Ingest the bundled corpus
        run: uv run sprout ingest
      - name: Eval suites (offline deterministic judge, merge-blocking)
        run: uv run sprout eval --out docs/audits
      - name: Structural a11y gate (chat UI + HTML report)
        run: |
          uv run sprout a11y-check web/dist/index.html
          uv run sprout a11y-check docs/audits/eval-report.html
      - name: Judge calibration (report-only — below threshold, gap tracked; see docs/ROADMAP.md)
        run: uv run sprout calibrate eval/judge_probes.yaml --out docs/audits

  pa11y:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory browser cross-check; excluded from ci-gate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install + ingest
        run: uv sync --frozen --extra serve && uv run sprout ingest
      - name: Serve and pa11y the UI
        run: |
          uv run sprout serve &
          sleep 5
          npx --yes pa11y-ci --config web/.pa11yci.json || true

  redteam:
    # Promptfoo OWASP LLM01-LLM10 red team (eval/redteam/promptfooconfig.yaml) — see
    # eval/redteam/README.md. Generation + grading call Anthropic and need
    # ANTHROPIC_API_KEY, so this is opt-in/advisory (like pa11y) until the key is
    # provisioned as a repo secret and a maintainer has watched a run go clean; it is
    # deliberately excluded from ci-gate's needs: list until then.
    runs-on: ubuntu-latest
    continue-on-error: true # advisory; excluded from ci-gate
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Check for ANTHROPIC_API_KEY
        id: gate
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: echo "run=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - name: Install + ingest
        if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen --extra serve && uv run sprout ingest
      - name: Serve the chat API
        if: steps.gate.outputs.run == 'true'
        run: |
          uv run sprout serve &
          sleep 5
      - name: Promptfoo red team (OWASP LLM01-LLM10)
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: eval/redteam
        run: npx --yes promptfoo@latest redteam run --no-progress-bar
      - name: No ANTHROPIC_API_KEY secret — skipped
        if: steps.gate.outputs.run != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY not configured; see eval/redteam/README.md. Skipping (advisory job, not gate-blocking)."

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install (docs)
        run: uv sync --frozen --group docs
      - name: MkDocs strict build
        run: uv run mkdocs build --strict

  zizmor:
    # Workflow-SAST review, RTA §F claim (CICD-19): any PR touching workflows is scanned.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: zizmor (workflow SAST)
        run: uvx zizmor --min-severity high .github/workflows/

  ci-gate:
    # The ONLY required status check for branch protection. pa11y is advisory.
    if: always()
    needs: [test, security, eval-a11y, docs, zizmor]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates to pass (skipped path-filtered jobs are OK)
        # Interpolating join(needs.*.result) straight into the script body reads as a
        # template-injection-adjacent pattern to workflow-SAST tools (zizmor flags it);
        # the values are GitHub-controlled enums (success/failure/skipped/cancelled) so it
        # was never exploitable, but routing through env: satisfies the rule directly
        # instead of waiving it.
        env:
          GATE_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: $GATE_RESULTS"
          for r in $GATE_RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a required gate did not pass: $r"
              exit 1
            fi
          done
