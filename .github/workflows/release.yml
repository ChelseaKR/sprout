name: release

# Fires when a GitHub Release is published, deliberately NOT on `push: tags` and NOT on
# `workflow_dispatch`. Publishing is a separate, deliberate act from tagging.
#
# WHY NOT `push: tags`. A tag push made publication irreversible at the moment of the
# push: `git push origin v1.2.3` is one command, needs no confirmation, and everything
# downstream of it — including the PyPI upload — ran unattended. PyPI never allows a
# version to be re-uploaded, so a tag pushed by mistake, or at the wrong commit, could
# not be taken back.
#
# It also could not have worked. This workflow used to call the shared
# ChelseaKR/.github `release-authorize` reusable workflow, whose first check is
# `test "${GITHUB_REF}" = refs/heads/main`. On a tag push `GITHUB_REF` is
# `refs/tags/v*`, so that job could only ever fail; the reusable workflow also takes
# the tag as an *input* rather than reading the ref, so passing `github.ref_name` handed
# it a value it does not consume that way. The trigger was changed to `push: tags`
# without relaxing either assumption, and no tag has ever been cut here to expose it.
#
# WHY NOT `workflow_dispatch`. That is the other way to make the `refs/heads/main` check
# hold, and it is worse here: a dispatch runs in the context of the default branch, so
# the `verify` job below — which checks out the release commit and runs that commit's
# `make verify` — would execute release code inside main's Actions cache scope. That is
# CodeQL `actions/cache-poisoning/poisonable-step` (error severity, CWE-349), which this
# repository's own `scripts/codeql_gate.py` fails the build on. Disabling the cache on
# `setup-uv` does not answer it: the finding is about the checked-out code being able to
# write that scope by any means, not about this workflow's own caching. A
# published-release event is scoped to `refs/tags/<tag>`, so the gate physically cannot
# write anything that main, or a branch cut from main, restores.
#
# Tag authorization therefore moves in-repo, to `.github/verify-release-tag.sh` checked
# against the committed `.github/allowed_signers` — the same mechanism ctdl-validate and
# tods-validate publish behind, copied byte-identical rather than reimplemented. It runs
# before anything is verified, built or uploaded, and it supports exactly this event.
#
# Releasing is now two steps instead of one:
#   git tag -s v0.1.0 -m "release: v0.1.0" && git push origin v0.1.0   # inert on its own
#   gh release create v0.1.0 --title "sprout v0.1.0" --generate-notes  # this starts it
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The trust boundary, and the first thing that runs. Nothing is verified, built,
  # uploaded or published from a tag that is not an annotated tag object whose SSH
  # signature verifies against the committed `.github/allowed_signers`.
  #
  # `.github/verify-release-tag.sh` is copied byte-identical from ctdl-validate rather
  # than written fresh, so there is one implementation of "is this a tag the maintainer
  # signed" across the portfolio instead of several that drift. It replaces the shared
  # `release-authorize` reusable workflow, which cannot be used on this event: that
  # workflow requires its caller to be dispatched from `refs/heads/main`, and a
  # published-release event runs at `refs/tags/<tag>`. The same checks are resolved
  # locally — annotated tag object, signature against a committed key, and below, stable
  # SemVer and a commit reachable from main.
  #
  # GRANDFATHERED_TAGS is empty and must stay empty: no tag has ever been cut in this
  # repository, so nothing predates this control and nothing is exempt.
  verify-tag:
    name: verify-tag (the release tag is one the maintainer signed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.verify.outputs.tag }}
      release-commit: ${{ steps.verify.outputs.commit }}
      tag-object-sha: ${{ steps.object.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and tags: the tag object being verified has to be present
          # locally for `git verify-tag` to read its signature, and the ancestry check
          # below needs main's history.
          fetch-depth: 0
          persist-credentials: false
      - name: The release tag is signed by a key this repository trusts
        id: verify
        env:
          # Routed through env: rather than interpolated into the run: shell. A tag name
          # reaches this script as `github` context data and carries no guarantee about
          # shell metacharacters.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          # Empty on purpose: this job resolves the commit, and every job below pins to
          # what it resolved rather than to a second resolution of the same name.
          EXPECT_COMMIT: ""
          ALLOWED_SIGNERS: .github/allowed_signers
          GRANDFATHERED_TAGS: ""
        run: bash .github/verify-release-tag.sh
      - name: The tag is stable SemVer and names a commit on main
        # The two checks the shared reusable workflow made that the script does not: a
        # release is cut from reviewed code on main, and pre-releases do not publish. A
        # signature proves who made the tag, not that the code passed review.
        env:
          TAG: ${{ steps.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.verify.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '${TAG}' must be stable SemVer (vX.Y.Z)."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main; then
            echo "::error::${RELEASE_COMMIT} is not reachable from origin/main. Release tags are cut on main only."
            exit 1
          fi
      - name: Record the immutable tag-object id
        # Rechecked against the live ref just before the PyPI upload, so a tag moved
        # between verification and publication is caught rather than assumed impossible.
        id: object
        env:
          TAG: ${{ steps.verify.outputs.tag }}
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git rev-parse "refs/tags/${TAG}")" >> "${GITHUB_OUTPUT}"

  verify:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.release-commit }}
          persist-credentials: false
      # No caching here either: this is a release event, so a cache poisoned by an
      # earlier, less-trusted run could be consumed here even though this job itself
      # holds no write credentials (zizmor `cache-poisoning`, high severity — found
      # 2026-07-05, applies workflow-wide on a release trigger, not just to the job
      # holding OIDC/attestation permissions).
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Re-run the full gate set at the tagged commit
        # RELEASE_TAG makes `make eval` (inside `make verify`) append this release's scores to
        # docs/audits/eval-history.jsonl and run the consecutive-decline drift gate (EXP-13),
        # gating on whatever ledger is committed at the tagged commit. This job has
        # `contents: read` only and cannot push, so the actual append-and-commit happens the
        # same way `docs/audits/eval-baseline.json` already does: the maintainer runs
        # `make eval RELEASE_TAG=<tag>` locally and commits the updated ledger before tagging;
        # this step is the fail-closed re-verification at the tagged commit, not the writer.
        env:
          TAG: ${{ needs.verify-tag.outputs.release-tag }}
        run: uv sync --locked --extra serve && uv run sprout ingest && make verify RELEASE_TAG="${TAG}"

      - name: Require tag, package, and changelog versions to match
        env:
          TAG: ${{ needs.verify-tag.outputs.release-tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${VERSION}" = "${PACKAGE_VERSION}"
          grep -Fq "## [${VERSION}]" CHANGELOG.md

  build:
    needs: [verify-tag, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.release-commit }}
          persist-credentials: false
      # No caching in the OIDC signing/publish job: this job holds id-token: write +
      # attestations: write, and a poisoned/stale cache is the standard's canonical
      # cache-poisoning exposure for a provenance job (SEC-30, CICD-24). The `verify`
      # job above has no credentials, but it does not cache either — see the note on its
      # `setup-uv` step.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build sdist + wheel
        run: uv build
      - name: Install the built package so the SBOM reflects real, non-empty deps
        run: uv sync --locked --no-dev
      - name: Generate SBOM (CycloneDX)
        run: uvx cyclonedx-py environment --output-format json --outfile sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
  publish-pypi:
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The irreversible step. `pypi` carries a required reviewer, so this job waits for
    # a human even though every gate above it is green: PyPI does not allow a version
    # to be re-uploaded, and this is the last point at which the release can be
    # stopped. The url is what the approval prompt shows the reviewer.
    environment:
      name: pypi
      url: https://pypi.org/p/sprout-plantcare
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Recheck immutable tag object before PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.release-tag }}
          TAG_OBJECT_SHA: ${{ needs.verify-tag.outputs.tag-object-sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
      - name: Publish to PyPI through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-release:
    needs: [verify-tag, build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist
      - name: Recheck the immutable tag object and attach the artifacts
        # The Release is what triggered this run, so it already exists and this attaches
        # to it rather than creating it — `gh release create` would fail here. That is
        # the point of the split: cutting the Release is the maintainer's deliberate act,
        # and everything verified, built and published hangs off it.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.release-tag }}
          TAG_OBJECT_SHA: ${{ needs.verify-tag.outputs.tag-object-sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
          gh release upload "${TAG}" dist/* --clobber
