name: release

# Dispatched by hand from `main`, naming an existing signed tag. Deliberately NOT
# `push: tags`.
#
# A tag push made publication irreversible at the moment of the push: `git push origin
# v1.2.3` is one command, it needs no confirmation, and everything downstream of it —
# including the PyPI upload — ran unattended. PyPI never allows a version to be
# re-uploaded, so a tag pushed by mistake, or pushed at the wrong commit, could not be
# taken back. The dispatch below is the same release, with the irreversible step moved
# behind a deliberate second action and the `pypi` environment's required reviewer.
#
# The tag-push trigger was also broken, which is why nothing here ever published. The
# `authorize` job below asserts `GITHUB_REF = refs/heads/main` (it is the shared
# authorizer's first check). On a tag push `GITHUB_REF` is `refs/tags/v*`, so the job
# could only ever fail, and the reusable workflow takes the tag as an *input* rather
# than reading the ref. This restores the dispatch-from-main + `tag` input shape the
# authorizer was written for and that this workflow used before the trigger was
# changed.
#
# On the cache-poisoning concern that motivated the tag-push trigger (CodeQL
# `actions/cache-poisoning/poisonable-step`, CWE-349: a dispatch runs in the default
# branch's cache scope, so a job that checks out release code could write a cache that
# branches cut from main later restore): every job in this workflow sets
# `enable-cache: false` and no job uses `actions/cache`, so there is no cache entry for
# a poisonable step to write. That, not the trigger, is what makes this safe — and it
# is checked rather than assumed, because a tag-push trigger bought the same property
# at the cost of an unattended, irreversible publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed stable SemVer tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The shared trust-boundary primitive: it owns tag authorization only (annotated,
  # signed by an allowed signer, stable SemVer, on main) and returns immutable
  # identifiers this workflow's own build/publish jobs pin to. It is consumed from the
  # publicly readable copy in the org profile repository, not from a copy a
  # non-collaborator cannot resolve — a caller can only reuse a workflow it can read,
  # so the public copy is the one that keeps working regardless of this repo's
  # visibility. Same commit, same behaviour; SHA-pinned so the trust boundary cannot
  # move under us.
  authorize:
    uses: ChelseaKR/.github/.github/workflows/release-authorize.yml@7be4c3e44e2acf20e8a98eeea4351c1e5d2789bc
    permissions:
      contents: read
    with:
      tag: ${{ inputs.tag }}

  verify:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.release-commit }}
          persist-credentials: false
      # No caching here either, and now it is load-bearing in both directions. This is
      # a release event, so a cache poisoned by an earlier, less-trusted run could be
      # consumed here even though this job itself holds no write credentials (zizmor
      # `cache-poisoning`, high severity — found 2026-07-05, applies workflow-wide, not
      # just to the job holding OIDC/attestation permissions). It is also what lets this
      # workflow be dispatched from `main` at all: with caching off there is no cache
      # entry for a poisonable step to write into main's scope (CodeQL
      # `actions/cache-poisoning/poisonable-step`). Turning caching on here would
      # reintroduce that finding — see this file's header.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Re-run the full gate set at the tagged commit
        # RELEASE_TAG makes `make eval` (inside `make verify`) append this release's scores to
        # docs/audits/eval-history.jsonl and run the consecutive-decline drift gate (EXP-13),
        # gating on whatever ledger is committed at the tagged commit. This job has
        # `contents: read` only and cannot push, so the actual append-and-commit happens the
        # same way `docs/audits/eval-baseline.json` already does: the maintainer runs
        # `make eval RELEASE_TAG=<tag>` locally and commits the updated ledger before tagging;
        # this step is the fail-closed re-verification at the tagged commit, not the writer.
        env:
          TAG: ${{ needs.authorize.outputs.release-tag }}
        run: uv sync --locked --extra serve && uv run sprout ingest && make verify RELEASE_TAG="${TAG}"

      - name: Require tag, package, and changelog versions to match
        env:
          TAG: ${{ needs.authorize.outputs.release-tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${VERSION}" = "${PACKAGE_VERSION}"
          grep -Fq "## [${VERSION}]" CHANGELOG.md

  build:
    needs: [authorize, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.release-commit }}
          persist-credentials: false
      # No caching in the OIDC signing/publish job: this job holds id-token: write +
      # attestations: write, and a poisoned/stale cache is the standard's canonical
      # cache-poisoning exposure for a provenance job (SEC-30, CICD-24). The `verify`
      # job above has no credentials, but it does not cache either: on a dispatch from
      # `main` its cache writes would land in main's scope.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Build sdist + wheel
        run: uv build
      - name: Install the built package so the SBOM reflects real, non-empty deps
        run: uv sync --locked --no-dev
      - name: Generate SBOM (CycloneDX)
        run: uvx cyclonedx-py environment --output-format json --outfile sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
  publish-pypi:
    needs: [authorize, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The irreversible step. `pypi` carries a required reviewer, so this job waits for
    # a human even though every gate above it is green: PyPI does not allow a version
    # to be re-uploaded, and this is the last point at which the release can be
    # stopped. The url is what the approval prompt shows the reviewer.
    environment:
      name: pypi
      url: https://pypi.org/p/sprout-plantcare
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Recheck immutable tag object before PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.authorize.outputs.release-tag }}
          TAG_OBJECT_SHA: ${{ needs.authorize.outputs.tag-object-sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
      - name: Publish to PyPI through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-release:
    needs: [authorize, build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist
      - name: Recheck immutable tag object and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.authorize.outputs.release-tag }}
          TAG_OBJECT_SHA: ${{ needs.authorize.outputs.tag-object-sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
          gh release create "${TAG}" dist/* \
            --title "sprout ${TAG}" --generate-notes
